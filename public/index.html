<!DOCTYPE html>
<html lang="fi" class="h-full bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lounaslista</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="description" content="Ravintola Kamu ja Opetustalo vierekk&#228;in &#8211; p&#228;iv&#228;n ja viikon lounaslistat yhdess&#228; n&#228;kym&#228;ss&#228;." />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lounas" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lounaslista" />
  <meta property="og:title" content="Lounas &#8211; Kamu &amp; Opetustalo" />
  <meta property="og:description" content="Ravintola Kamu ja Opetustalo vierekk&#228;in &#8211; p&#228;iv&#228;n ja viikon lounaslistat yhdess&#228; n&#228;kym&#228;ss&#228;." />
  <meta property="og:url" content="https://ruokalistat.pmlo.dev/" />
  <meta property="og:image" content="https://ruokalistat.pmlo.dev/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lounas &#8211; Kamu &amp; Opetustalo" />
  <meta name="twitter:description" content="Ravintola Kamu ja Opetustalo vierekk&#228;in &#8211; p&#228;iv&#228;n ja viikon lounaslistat yhdess&#228; n&#228;kym&#228;ss&#228;." />
  <meta name="twitter:image" content="https://ruokalistat.pmlo.dev/og-image.png" />

  <meta name="theme-color" content="#09090b" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full p-4 md:p-8 flex flex-col items-center">
  <header class="w-full max-w-4xl mb-6 flex flex-wrap justify-between items-baseline gap-3 border-b border-zinc-200 dark:border-zinc-800 pb-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">Lounas</h1>
      <p id="date-label" class="text-sm text-zinc-500 dark:text-zinc-400 mt-0.5">Ladataan...</p>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex text-xs font-medium rounded-md bg-zinc-200 dark:bg-zinc-800 p-0.5">
        <button id="btn-today" onclick="setViewMode('today')" class="px-3 py-1 rounded transition">Tänään</button>
        <button id="btn-week" onclick="setViewMode('week')" class="px-3 py-1 rounded transition">Viikko</button>
      </div>
      <button onclick="fetchMenus()" class="text-xs font-medium px-3 py-1.5 rounded-md bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 dark:hover:bg-zinc-700 transition">
        Päivitä
      </button>
    </div>
  </header>

  <main id="container" class="w-full max-w-4xl space-y-4">
    <div class="animate-pulse bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl p-6 h-48"></div>
    <div class="animate-pulse bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl p-6 h-48"></div>
  </main>

  <footer class="w-full max-w-4xl mt-8 pt-4 border-t border-zinc-200 dark:border-zinc-800 flex flex-wrap justify-between items-center gap-2 text-xs text-zinc-400 dark:text-zinc-500">
    <p>Lounaslistat haetaan ravintoloiden omista rajapinnoista.</p>
    <a href="https://github.com/AleksiPamilo/ruokalistat" target="_blank" rel="noopener" class="flex items-center gap-1.5 hover:text-zinc-600 dark:hover:text-zinc-300 transition">
      <svg viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.5 7.5 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
      <span>AleksiPamilo/ruokalistat</span>
    </a>
  </footer>

  <script>
    let latestData = null;
    let viewMode = 'today';
    try {
      viewMode = localStorage.getItem('lunch-view-mode') || 'today';
    } catch {}

    function setViewMode(mode) {
      viewMode = mode;
      try {
        localStorage.setItem('lunch-view-mode', mode);
      } catch {}
      updateToggleUI();
      if (latestData) render(latestData);
    }

    function updateToggleUI() {
      const activeClass = 'bg-white dark:bg-zinc-950 shadow-sm';
      const inactiveClass = 'text-zinc-500 dark:text-zinc-400';
      document.getElementById('btn-today').className = `px-3 py-1 rounded transition ${viewMode === 'today' ? activeClass : inactiveClass}`;
      document.getElementById('btn-week').className = `px-3 py-1 rounded transition ${viewMode === 'week' ? activeClass : inactiveClass}`;
    }

    async function fetchMenus() {
      const container = document.getElementById('container');
      try {
        const res = await fetch('/api/menu');
        const data = await res.json();
        latestData = data;
        render(data);
      } catch (err) {
        container.innerHTML = `<p class="text-rose-500">Tietojen haku epäonnistui: ${escapeHtml(err.message)}</p>`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function isoWeekDates(anchorIso) {
      const anchor = new Date(anchorIso + 'T00:00:00Z');
      const dow = (anchor.getUTCDay() + 6) % 7;
      const monday = new Date(anchor);
      monday.setUTCDate(anchor.getUTCDate() - dow);
      const dates = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setUTCDate(monday.getUTCDate() + i);
        dates.push(d.toISOString().slice(0, 10));
      }
      return dates;
    }

    function weekdayLabel(iso) {
      return new Date(iso + 'T00:00:00Z').toLocaleDateString('fi-FI', { weekday: 'long', timeZone: 'UTC' });
    }

    function shortDateLabel(iso) {
      const d = new Date(iso + 'T00:00:00Z');
      return `${d.getUTCDate()}.${d.getUTCMonth() + 1}.`;
    }

    function render(data) {
      updateToggleUI();
      const dates = viewMode === 'today'
        ? [data.date]
        : isoWeekDates(data.date).filter(d => d >= data.date);

      document.getElementById('date-label').textContent = viewMode === 'today'
        ? `${weekdayLabel(data.date)} ${shortDateLabel(data.date)}`
        : `${shortDateLabel(dates[0])}–${shortDateLabel(dates[dates.length - 1])}`;

      document.getElementById('container').innerHTML = dates
        .map(date => renderDaySection(date, data.restaurants, date === data.date))
        .join('');
    }

    function renderDaySection(date, restaurants, isToday) {
      return `
        <section>
          <div class="flex items-baseline gap-2 mb-2 px-1">
            <h2 class="text-sm font-bold capitalize ${isToday ? 'text-blue-600 dark:text-blue-400' : 'text-zinc-500 dark:text-zinc-400'}">${escapeHtml(weekdayLabel(date))}</h2>
            <span class="text-xs text-zinc-400">${escapeHtml(shortDateLabel(date))}</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-2">
            ${restaurants.map(r => renderRestaurantDay(r, date)).join('')}
          </div>
        </section>
      `;
    }

    function renderRestaurantDay(r, date) {
      const day = r.days.find(d => d.date === date);
      return `
        <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl p-4 shadow-sm">
          <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-semibold">${escapeHtml(r.name)}</h3>
            <a href="${r.sourceUrl}" target="_blank" rel="noopener" class="text-[11px] text-blue-500 hover:underline">Alkuperäinen</a>
          </div>
          ${!day || !day.categories.length
            ? `<p class="text-sm text-zinc-400 italic">${escapeHtml(!r.isOpen && r.message ? r.message : 'Ei lounasta tänä päivänä.')}</p>`
            : `<div class="space-y-3">${day.categories.map(renderCategory).join('')}</div>`}
        </div>
      `;
    }

    function renderCategory(c) {
      return `
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-bold uppercase tracking-wider text-zinc-500">${escapeHtml(c.title)}</span>
            ${(c.diets || []).map(d => `<span class="text-[10px] font-semibold bg-zinc-100 dark:bg-zinc-800 px-1.5 py-0.5 rounded text-zinc-600 dark:text-zinc-300">${escapeHtml(d)}</span>`).join('')}
          </div>
          <ul class="text-sm space-y-1">
            ${c.items.map(item => `
              <li class="flex justify-between items-start gap-2">
                <span>${escapeHtml(item.name)}</span>
                ${item.diets?.length ? `<span class="text-[10px] text-zinc-400 shrink-0 mt-0.5">${escapeHtml(item.diets.join(', '))}</span>` : ''}
              </li>
            `).join('')}
          </ul>
        </div>
      `;
    }

    updateToggleUI();
    fetchMenus();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
